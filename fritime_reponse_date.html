<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réponse à l'invitation – Fri-Time Intyamon</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.1);max-width:480px;width:100%;padding:2.5rem 2rem;text-align:center}
    .logo{font-size:2rem;margin-bottom:.5rem}
    .org{font-size:.85rem;color:#888;margin-bottom:2rem}
    .icon{font-size:3.5rem;margin-bottom:1rem}
    h1{font-size:1.35rem;font-weight:700;margin-bottom:.75rem;color:#1a1a1a}
    .activity{font-size:1rem;color:#444;margin-bottom:.5rem}
    .date-badge{display:inline-block;background:#eef2ff;color:#4f46e5;border-radius:8px;padding:.4rem 1rem;font-size:.9rem;font-weight:600;margin-bottom:1.5rem}
    .message{font-size:.95rem;color:#555;line-height:1.6;margin-bottom:2rem}
    .loading{color:#888;font-size:.95rem;margin-top:1rem}
    .error{background:#fef2f2;color:#ef4444;border-radius:8px;padding:1rem;font-size:.9rem;margin-top:1rem}
    .footer{margin-top:2rem;font-size:.8rem;color:#aaa}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎉</div>
  <div class="org">Fri-Time Intyamon</div>
  <div id="content">
    <div class="loading">Chargement en cours…</div>
  </div>
  <div class="footer">Fri-Time Intyamon · Réservé aux participants</div>
</div>

<script>
var SUPABASE_URL='https://pixktldfpjtnimngvgqz.supabase.co';
var SUPABASE_KEY='sb_publishable_ZV04eYw85SDFQi43SwZJTg_igofPU8X';

function getParam(name){
  var m=new RegExp('[?&]'+name+'=([^&]*)').exec(window.location.search);
  return m?decodeURIComponent(m[1].replace(/\+/g,' ')):null;
}

function sbFetch(path,method,body){
  return fetch(SUPABASE_URL+'/rest/v1/'+path,{
    method:method||'GET',
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':'Bearer '+SUPABASE_KEY,
      'Content-Type':'application/json',
      'Prefer': method==='POST'?'return=representation':'return=minimal'
    },
    body:body?JSON.stringify(body):undefined
  }).then(function(r){return r.json();});
}

async function main(){
  var actId=getParam('act');
  var inscId=getParam('insc');
  var rep=getParam('rep');
  var contentEl=document.getElementById('content');

  if(!actId||!inscId||!['oui','non'].includes(rep)){
    contentEl.innerHTML='<div class="error">Lien invalide ou incomplet. Veuillez vérifier l\'email reçu.</div>';
    return;
  }

  // Charger l'activité
  var acts=[];
  try{acts=await sbFetch('activites?id=eq.'+actId+'&select=nom,date&limit=1');}catch(e){}
  var act=acts&&acts[0]?acts[0]:null;
  var actNom=act?act.nom:'cette activité';
  var actDate=act&&act.date?act.date.split('-').reverse().join('.'):'';

  // Vérifier si une réponse existe déjà
  var cle='nd_rep_'+actId+'_'+inscId;
  var existing=[];
  try{existing=await sbFetch('parametres?cle=eq.'+encodeURIComponent(cle)+'&limit=1');}catch(e){}

  if(existing&&existing[0]){
    var ancienneRep=existing[0].valeur;
    if(ancienneRep===rep){
      showResult(rep,actNom,actDate,true,false);
      return;
    }
    // Mettre à jour la réponse
    try{
      await sbFetch('parametres?cle=eq.'+encodeURIComponent(cle),'PATCH',{valeur:rep,updated_at:new Date().toISOString()});
    }catch(e){
      contentEl.innerHTML='<div class="error">Une erreur est survenue lors de l\'enregistrement. Veuillez réessayer.</div>';
      return;
    }
    showResult(rep,actNom,actDate,false,true);
    return;
  }

  // Enregistrer la nouvelle réponse
  try{
    await sbFetch('parametres','POST',{cle:cle,valeur:rep,updated_at:new Date().toISOString()});
  }catch(e){
    contentEl.innerHTML='<div class="error">Une erreur est survenue lors de l\'enregistrement. Veuillez réessayer.</div>';
    return;
  }
  showResult(rep,actNom,actDate,false,false);
}

function showResult(rep,actNom,actDate,deja,modif){
  var el=document.getElementById('content');
  var icon=rep==='oui'?'✅':'❌';
  var titre=rep==='oui'?'Participation confirmée !':'Participation refusée';
  var couleur=rep==='oui'?'#22c55e':'#ef4444';
  var bg=rep==='oui'?'#f0fdf4':'#fef2f2';
  var msg='';
  if(rep==='oui'){
    msg=deja?'Votre participation avait déjà été confirmée pour cette activité.'
      :modif?'Votre réponse a été mise à jour. Nous sommes ravis de compter sur votre présence !'
      :'Merci ! Votre participation a bien été enregistrée. Nous avons hâte de vous retrouver !';
  } else {
    msg=deja?'Votre refus avait déjà été enregistré pour cette activité.'
      :modif?'Votre réponse a été mise à jour. Merci de nous avoir informés !'
      :'Merci de nous avoir informés. Nous espérons vous retrouver lors d\'une prochaine activité !';
  }
  el.innerHTML='<div class="icon">'+icon+'</div>'
    +'<h1 style="color:'+couleur+'">'+titre+'</h1>'
    +(actNom?'<div class="activity">'+escH(actNom)+'</div>':'')
    +(actDate?'<div class="date-badge">📅 '+actDate+'</div>':'')
    +'<div class="message" style="background:'+bg+';border-radius:8px;padding:1rem">'+escH(msg)+'</div>';
}

function escH(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

main();
</script>
</body>
</html>
